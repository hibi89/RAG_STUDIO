name: P5.23 pinned E5 model artifact manifest checks
on:
  push:
    branches:
      - feature/p523-pinned-e5-assets
    paths:
      - .github/workflows/p523-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/local-model-preflight.mjs
          node --check scripts/p522-offline-dense-cli.mjs
          node --check tests/p523-model-lock.test.mjs
      - name: Full regression and scoped model provenance test
        run: |
          npm test
          npm run doctor
          npm run test:gold
          npm run test:negative
          npm run test:heldout
      - name: Real CLI no-model fallback gate (no model binary is downloaded)
        run: |
          node scripts/p522-offline-dense-cli.mjs "$PWD/fixtures/ax_multi_doc_v0" "반품 신청 기간은?" | tee /tmp/p523-output.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('/tmp/p523-output.json','utf8'));if(r.status!=='FALLBACK_BM25'||r.result.fallback.actual!=='bm25_line_ngrams') process.exit(2)"
