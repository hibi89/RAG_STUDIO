name: P5.10 bundled ZIP MVP vertical slice
on:
  push:
    branches:
      - feature/p510-mvp-zip-dashboard
    paths:
      - .github/workflows/p510-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public synthetic repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Syntax
        run: |
          node --check src/synthetic-zip-workspace.mjs
          node --check scripts/p510-mvp-zip-dashboard.mjs
          node --check tests/p510-mvp-zip-dashboard.test.mjs
          node --check scripts/p510-cli-smoke.mjs
      - name: End-to-end synthetic ZIP and existing regression
        run: npm test
      - name: Actual Chrome dashboard smoke (isolated before CLI process)
        run: node scripts/p32-browser-smoke.mjs
      - name: Existing synthetic evidence evaluation
        run: |
          npm run doctor
          npm run test:gold
          npm run test:negative
          npm run test:heldout
      - name: Real npm-style CLI to ZIP to authenticated cited answer
        run: node scripts/p510-cli-smoke.mjs
