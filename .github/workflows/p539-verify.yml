name: P5.39 fixed SKU SQL and CSV provenance
on:
  push:
    branches:
      - feature/p539-sku-sql-cited-query
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
      - run: npm run demo:router
      - run: node scripts/p537-interactive-smoke.mjs
      - run: node --check ui/app.js
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
      - run: npm run demo:router
      - run: node scripts/p537-interactive-smoke.mjs
      - run: node --check ui/app.js
