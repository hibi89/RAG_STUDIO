name: P5.31 Windows Node identity diagnostics
on:
  push:
    branches:
      - feature/p531-win-file-identity-diagnostics
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-matrix:
    name: Windows Node ${{ matrix.node }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '22.23.0', '24.11.0']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect synthetic path and handle identity (no source disclosure)
        run: node scripts/p531-windows-identity-probe.mjs
      - name: Windows pinned synthetic preflight
        run: node scripts/windows-preflight.mjs
      - name: Independent full Node regression gate
        run: npm test
      - name: Independent doctor gate
        run: npm run doctor
  linux-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/p531-windows-identity-probe.mjs
      - run: npm test
