name: P5.43 fastloop and portable native Windows runtime
on:
  push:
    branches:
      - feature/p543-portable-native-verify-fastloop
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
      - run: npm run demo:router
      - run: node scripts/p537-interactive-smoke.mjs
      - run: node --check scripts/p543-native-portable.mjs
      - run: node --check scripts/p543-verify-native-portable.mjs
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.0'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
      - run: npm run demo:router
      - name: Single command verification smoke
        shell: pwsh
        run: .\verify_local.ps1 -Quick
      - name: Prepare fresh portable output parent
        shell: pwsh
        run: New-Item -ItemType Directory -Path dist -Force | Out-Null
      - name: Build native portable runtime once
        run: node scripts/p543-native-portable.mjs "${{ github.workspace }}\dist\rag-native-preview"
      - name: Verify copied portable folder and actual HTTP search
        run: node scripts/p543-native-portable-smoke.mjs "${{ github.workspace }}\dist\rag-native-preview"
      - name: Upload unsigned portable local preview package
        uses: actions/upload-artifact@v4
        with:
          name: RAG_STUDIO_P543_NATIVE_PORTABLE_SYNTHETIC
          path: dist/rag-native-preview/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
