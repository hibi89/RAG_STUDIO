name: P5.36 local approval readiness (HOLD only)
on:
  push:
    branches:
      - feature/p536-local-approval-plan
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/p535-local-review-smoke.mjs
      - run: node scripts/p533-build-portable.mjs
      - name: Verify new plan CLI in portable copy (synthetic only)
        run: |
          node dist/rag-studio-mvp/scripts/p533-verify-portable.mjs
          node dist/rag-studio-mvp/src/local-smax-approval-plan-cli.mjs "$PWD/fixtures/smax_p42/synthetic_v1.json" "$PWD/fixtures/ax_multi_doc_v0/sales.csv" "$PWD/fixtures/ax_multi_doc_v0/returns_policy.txt" > /dev/null
  windows:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/p535-local-review-smoke.mjs
      - run: node scripts/p533-build-portable.mjs
      - name: Verify new plan CLI in Windows portable copy (synthetic only)
        shell: pwsh
        run: |
          node dist/rag-studio-mvp/scripts/p533-verify-portable.mjs
          $root=(Get-Location).Path
          node dist/rag-studio-mvp/src/local-smax-approval-plan-cli.mjs "$root/fixtures/smax_p42/synthetic_v1.json" "$root/fixtures/ax_multi_doc_v0/sales.csv" "$root/fixtures/ax_multi_doc_v0/returns_policy.txt" | Out-Null
          if($LASTEXITCODE -ne 0){exit 1}
