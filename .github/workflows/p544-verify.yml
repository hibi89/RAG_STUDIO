name: P5.44 3-file SMAX browser review HOLD and full regression
on:
  push:
    branches:
      - feature/p544-browser-smax-review-hold
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/p544-browser-smax-review-plan.test.mjs
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
      - run: node --check ui/app.js
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.0'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/p544-browser-smax-review-plan.test.mjs
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
      - run: node --check ui/app.js
