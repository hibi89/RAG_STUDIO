name: P5.30 real Chromium and Windows synthetic readiness
on:
  push:
    branches:
      - feature/p530-real-browser-windows-gate
      - feature/p531-win-file-identity-diagnostics
    paths:
      - '.github/workflows/p530-verify.yml'
      - 'scripts/p530-csv-browser-e2e.mjs'
      - '.gitattributes'
      - 'src/**'
      - 'ui/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: CI-only browser driver (no package lock changes)
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Browser and syntax prerequisites
        run: |
          command -v google-chrome
          google-chrome --version
          node --check scripts/p530-csv-browser-e2e.mjs
      - name: Real headless Chromium browser interactions
        run: node scripts/p530-csv-browser-e2e.mjs
      - name: Full Node regressions and evidence evaluations
        run: |
          npm test
          npm run doctor
          npm run test:gold
          npm run test:negative
          npm run test:heldout
  windows-node-preflight:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # P5.31: Windows Node22.16 path-lstat dev=0 while fd-fstat dev!=0;
          # Windows 22.23 and 24.11 both passed 441/441 without changing guards.
          node-version: '22.23.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual Windows synthetic readiness preflight
        run: node scripts/windows-preflight.mjs
      - name: Full Node regression on Windows (independent exit code)
        run: npm test
      - name: Windows doctor (independent exit code)
        run: npm run doctor
