name: P5.45 review HOLD export regression
on:
  push:
    branches:
      - feature/p545-review-plan-export
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.16.0'
          - os: windows-2025
            node: '22.23.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: ${{ matrix.node }}}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/p545-review-hold-export.test.mjs
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
