name: P5.35 local selected SMAX review HOLD on Linux Windows and ZIP
on:
  push:
    branches:
      - feature/p535-local-smax-review-hold
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-local-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full tests including unapproved and malicious file rejection
        run: npm test
      - name: Live direct process local review without import
        run: node scripts/p535-local-review-smoke.mjs
      - name: Build source-only portable package
        run: node scripts/p533-build-portable.mjs
      - name: Live copied portable source reviewer
        env:
          RAG_P535_FROM_PORTABLE: '1'
        run: node scripts/p535-local-review-smoke.mjs
      - name: Preserve previous SMAX-to-RAG E2E
        env:
          RAG_P534_FROM_PORTABLE: '1'
        run: node scripts/p534-vertical-smoke.mjs
  windows-local-review:
    runs-on: windows-2025
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete native Windows tests
        run: npm test
      - name: Live CMD and source CLI on Windows
        run: node scripts/p535-local-review-smoke.mjs
      - name: Build portable package (no dependencies bundled)
        run: node scripts/p533-build-portable.mjs
      - name: Live CMD review from copied portable directory
        env:
          RAG_P535_FROM_PORTABLE: '1'
        run: node scripts/p535-local-review-smoke.mjs
      - name: Preserve original portable SQL and cited document flow
        env:
          RAG_P534_FROM_PORTABLE: '1'
        run: node scripts/p534-vertical-smoke.mjs
      - name: Create portable synthetic bundle with local HOLD reviewer
        shell: pwsh
        run: Compress-Archive -Path 'dist/rag-studio-mvp/*' -DestinationPath 'dist/RAG_STUDIO_MVP_REVIEW_HOLD.zip'
      - name: Extract ZIP and verify source signatures
        shell: pwsh
        run: |
          Expand-Archive -Path 'dist/RAG_STUDIO_MVP_REVIEW_HOLD.zip' -DestinationPath 'dist/zip-unpacked'
          node dist/zip-unpacked/scripts/p533-verify-portable.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: RAG_STUDIO_P535_LOCAL_REVIEW_MVP
          path: dist/RAG_STUDIO_MVP_REVIEW_HOLD.zip
          retention-days: 7
          if-no-files-found: error
