name: P5.17 grounded local conversational follow-up
on:
  push:
    branches:
      - feature/p517-grounded-followup
    paths:
      - .github/workflows/p517-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/conversation.mjs
          node --check src/dashboard-server.mjs
          node --check ui/app.js
          node --check tests/p517-followup.test.mjs
      - name: Full regression
        run: npm test
      - name: Evidence safety checks
        run: |
          npm run doctor
          npm run test:gold
          npm run test:negative
          npm run test:heldout
