name: P5.47 PREP bound draft review
on:
  push:
    branches:
      - feature/p547-bound-draft-review
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.16.0'
          - os: windows-2025
            node: '22.23.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/p546-prep-mapping-plan.test.mjs tests/p546-prep-cli.test.mjs tests/p547-prep-mapping-draft.test.mjs
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
      - run: npm run demo:router
