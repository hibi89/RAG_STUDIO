name: P5.47 RAG local owner mapping regression
on:
  push:
    branches:
      - feature/p546-rag-prep-mapping
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.16.0'
          - os: windows-2025
            node: '22.23.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/p547-owner-ui.test.mjs tests/p547-owner-verify.test.mjs
      - run: node --test tests/p548-local-ui-server.test.mjs
      - run: node --test tests/p549-mapped-sales.test.mjs tests/p550-preview-ui.test.mjs tests/p551-mixed-preview.test.mjs tests/p552-mixed-ui.test.mjs tests/p553-review-bundle.test.mjs
      - run: node --check ui/prep-owner.js
      - run: node --check src/prep-mapped-sales.mjs
      - run: node --check src/prep-mixed-preview.mjs
      - run: npm test
      - run: npm run test:gold
      - run: npm run test:negative
      - run: npm run test:heldout
