name: P5.16 verified local document explorer
on:
  push:
    branches:
      - feature/p516-local-document-explorer
    paths:
      - .github/workflows/p516-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/dashboard-server.mjs
          node --check ui/app.js
          node --check tests/p516-document-explorer.test.mjs
      - name: Whole test suite
        run: npm test
      - name: Evidence regressions
        run: |
          npm run doctor
          npm run test:gold
          npm run test:negative
          npm run test:heldout
