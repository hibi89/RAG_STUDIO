name: P5.28 local CSV unapproved schema review
on:
  push:
    branches:
      - feature/p528-local-csv-schema-review
    paths:
      - .github/workflows/p528-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and full regression
        run: |
          node --check src/local-csv-review.mjs
          node --check scripts/p528-inspect-csv.mjs
          node --check tests/p528-local-csv-review.test.mjs
          npm test
          npm run doctor
          npm run test:gold
          npm run test:negative
          npm run test:heldout
      - name: Real synthetic source and unchanged verified baseline
        run: |
          node scripts/p528-inspect-csv.mjs "$PWD/fixtures/ax_multi_doc_v0/sales.csv" "$PWD/fixtures/ax_multi_doc_v0" | tee /tmp/p528-inspection.json
          node --input-type=module -e "import fs from 'node:fs';let d=JSON.parse(fs.readFileSync('/tmp/p528-inspection.json','utf8'));if(d.status!=='NEEDS_REVIEW'||d.imported_to_sqlite!==false||d.verified_baseline.revenue_krw!=='157000')process.exit(2)"
