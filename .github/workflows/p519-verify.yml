name: P5.19 offline lexical hybrid experiment
on:
  push:
    branches:
      - feature/p519-offline-lexical-hybrid
    paths:
      - .github/workflows/p519-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/lexical-hybrid.mjs
          node --check src/document-search.mjs
          node --check src/dashboard-server.mjs
          node --check src/knowledge-base.mjs
          node --check ui/app.js
          node --check tests/p519-hybrid.test.mjs
          node --check scripts/p519-retrieval-benchmark.mjs
      - name: Native entire suite
        run: npm test
      - name: Existing evidence regression
        run: |
          npm run doctor
          npm run test:gold
          npm run test:negative
          npm run test:heldout
      - name: CPU and memory trade-off numbers
        run: node scripts/p519-retrieval-benchmark.mjs
